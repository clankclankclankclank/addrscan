<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cross-check public crypto addresses against multiple security and on-chain data providers.">
  <title>Addrscan</title>
  <link rel="icon" href="./logo.svg?v=5" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <header class="reveal">
      <h1>Addr<em>scan</em></h1>
      <p class="intro">Explore recorded Ethereum sample reports. <a href="https://github.com/clankclankclankclank/addrscan#run-locally">Run Addrscan locally</a> for live lookups.</p>
    </header>
    <section class="lookup reveal" aria-labelledby="lookup-title">
      <h2 class="section-title" id="lookup-title">Address lookup</h2>
      <form>
        <div class="input-row">
          <label class="sr-only" for="network">Network</label>
          <select id="network" disabled><option value="ethereum">Ethereum</option></select>
          <label class="sr-only" for="address">Public address</label>
          <input id="address" name="address" placeholder="Choose a sample below" readonly required spellcheck="false" autocomplete="off" autocapitalize="off">
          <button class="submit" type="submit" hidden><span id="submit-label">Scan</span></button>
        </div>
        <div class="samples" aria-label="Example addresses">
          <span>Try an example</span>
          <button type="button" class="sample" data-address="0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2">
            Normal Address
          </button>
          <button type="button" class="sample" data-address="0x16Af29b7eFbf019ef30aae9023A5140c012374A5">
            Malicious Address
          </button>
        </div>
      </form>
    </section>
    <div id="scan-loader" class="scan-loader" hidden>
      <span class="lattice" aria-hidden="true"></span>
      <span id="scan-phase">Requesting provider reports…</span>
    </div>
    <p id="status" role="status"></p>
    <section id="results" aria-label="Address report" hidden>
      <div class="report-overview">
        <div><h2 id="risk-summary"></h2><p id="coverage"></p></div>
        <a id="explorer" target="_blank" rel="noopener noreferrer">View explorer</a>
      </div>
      <h3 class="section-title">Provider results</h3>
      <ul id="providers" class="provider-list"></ul>
      <details id="details" hidden>
        <summary>View GoPlus signals</summary>
        <ul id="signals"></ul>
      </details>
    </section>
  </main>
</body>
</html>
